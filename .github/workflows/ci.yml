# 离线校验 CI · 只做一件事：在干净环境里跑 npm run verify。
#
# 为什么没有 npm install：
#   - 仓库里现有的离线测试与检查只 import Node 内置模块和仓库内相对路径。
#   - 仓库不提交锁文件（package-lock.json / pnpm-lock.yaml 被 .gitignore 忽略），
#     `npm ci` 无从执行；一旦将来引入需要依赖的测试，必须同时提交锁文件并改这里。
#
# 诚实边界：本文件只证明「离线检查在干净环境通过」。不证明真实 QQ/Web 链路、
# 真实模型质量、数据恢复，也不代表 GitHub 分支保护已开启（那要在仓库设置里配）。
# 本工作流不部署任何东西。
name: verify

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: offline verify (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: node version
        run: node --version
      - name: offline verify (tests + structure + docs)
        run: npm run verify

  aggregate:
    name: aggregate result
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: required job must have succeeded
        run: |
          echo "verify result: ${{ needs.verify.result }}"
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "::error::required job did not succeed (cancelled or failed counts as failure)"
            exit 1
          fi
